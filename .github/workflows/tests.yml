name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; lines=Path('requirements.txt').read_text(encoding='utf-16').splitlines(); Path('requirements-linux.txt').write_text('\n'.join(line for line in lines if not line.startswith('pywin32==')), encoding='utf-8')"
          python -m pip install -r requirements-linux.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest -q
