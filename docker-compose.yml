services:
  api:
    build: .
    container_name: fraud_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./data:/app/data
    restart: always

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fraud_dashboard
    ports:
      - "5500:80"
    depends_on:
      - api
    restart: always